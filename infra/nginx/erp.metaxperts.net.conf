# Reverse proxy for the MetaXperts ERP — erp.metaxperts.net
#
# One origin serves both tiers:
#   /        → Next.js web   (127.0.0.1:3001)
#   /api/    → NestJS API    (127.0.0.1:3300)   (trailing slash strips the /api prefix)
#
# The web is built with NEXT_PUBLIC_API_URL=/api, so the browser calls same-origin /api/*
# (no CORS needed). WebSocket (socket.io realtime) is supported under /api/.
#
# Install (run as root — see infra/nginx/README in the commit message / chat):
#   sudo cp infra/nginx/erp.metaxperts.net.conf /etc/nginx/sites-available/erp.metaxperts.net
#   sudo ln -sf /etc/nginx/sites-available/erp.metaxperts.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.metaxperts.net           # adds HTTPS (443) + redirect
#
# Uniquely-named map var so it never collides with a map already defined by another site.
map $http_upgrade $erp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.metaxperts.net;

    # Allow product images / employee photos / attachment uploads.
    client_max_body_size 50m;

    # --- NestJS API (:3300). Trailing slash on proxy_pass strips the /api/ prefix, so
    #     /api/auth/login → http://127.0.0.1:3300/auth/login ---
    location /api/ {
        proxy_pass http://127.0.0.1:3300/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (socket.io realtime gateway)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $erp_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Next.js web (:3001) ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $erp_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
