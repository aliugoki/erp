# Prometheus — local dev scrape config. Scrapes itself, the OTel collector, and the API's /metrics
# (RED + USE custom metrics, Chunk 8.2). Alert rules live in prometheus-alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # The API runs on the host; reach it via the docker host-gateway (extra_hosts in compose).
  - job_name: metaxperts-api
    static_configs:
      - targets: ["host.docker.internal:3300"]
