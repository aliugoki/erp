<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · MetaXperts ERP</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b0b0f; color: #e7e7ea; display: grid; place-items: center; height: 100vh; margin: 0; }
      .card { text-align: center; max-width: 28rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { color: #9ca3af; line-height: 1.5; }
      button { margin-top: 1rem; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid #2a2a35; background: #15151c; color: #e7e7ea; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page hasn't been cached yet. Open the Point of Sale screen at least once while online — it will then keep working without internet, queueing sales until you reconnect.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
